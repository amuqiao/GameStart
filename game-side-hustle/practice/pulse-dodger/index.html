<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Pulse Dodger</title>
  <!--
    CrazyGames HTML5 SDK v3.
    刻意放在 index.html 而不是 import 进 bundle:
      1. SDK 无 npm 包、无官方 TypeScript 类型,只能作为全局变量使用;
      2. CrazyGames 要求 SDK 由平台侧脚本提供,打进 bundle 会拿不到真实 iframe 环境。
    类型声明见 src/platform/crazygames.d.ts。
  -->
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #080b14;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      /* 平板上长按放大/选中会干扰触屏操作,CrazyGames 技术要求里明确建议禁用 */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    #game-root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #game-root canvas { display: block; }
    /* 加载遮罩。默认 hidden,只有加载超过 300ms 才由 JS 显示出来 */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: #080b14; color: #64748b;
      font-size: 15px; letter-spacing: 0.08em;
    }
    #loading-overlay[hidden] { display: none; }
    .loading-bar {
      width: min(240px, 60vw); height: 4px;
      background: #1e293b; border-radius: 2px; overflow: hidden;
    }
    .loading-bar-fill {
      width: 0%; height: 100%; background: #5eead4;
      transition: width 120ms linear;
    }

    /* CrazyGames banner 容器:尺寸必须由外层固定,SDK 只负责往里塞广告 */
    #banner-bottom {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: env(safe-area-inset-bottom, 0px);
      width: 320px; height: 50px; z-index: 10; pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="loading-overlay" hidden>
    <div>Loading</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>
  <div id="banner-bottom"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
